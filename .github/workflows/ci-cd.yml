name: CI/CD Backend

# Fail fast → build/push GHCR → k8s deploy (namespace `sakena`) → verify.
#
# `ci` also runs on pull requests so a broken build/test never reaches `main`
# in the first place; build/deploy only run on pushes to `main` (or tags),
# same gating as before.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/asd-sakena/sakena-backend
  NAMESPACE: sakena
  DEPLOYMENT: sakena-backend
  CONTAINER: sakena-backend

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore

  build-and-push:
    name: Build & push
    needs: [ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short sha
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: sha-${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          echo "${{ secrets.KUBE_CONFIG_SAKENA }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Roll out new image
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" set image "deployment/$DEPLOYMENT" \
            "$CONTAINER=$IMAGE_NAME:$IMAGE_TAG" --record=false

      - name: Wait for rollout, roll back on failure
        run: |
          set -euo pipefail
          if ! kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=180s; then
            echo "::error::Rollout failed - rolling back deployment/$DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout undo "deployment/$DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=120s || true
            echo "--- describe ---"
            kubectl -n "$NAMESPACE" describe "deployment/$DEPLOYMENT"
            echo "--- recent pod logs ---"
            kubectl -n "$NAMESPACE" logs -l app="$DEPLOYMENT" --tail=100 --since=10m || true
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail

          # Actuator lives on the management port, which the public ingress
          # deliberately does not route, and the ci-deployer token is not
          # allowed to port-forward. The readiness probe already polls
          # /actuator/health on that port, so a Ready pod IS a healthy pod —
          # this asserts that rather than re-checking health over the network.
          # `rollout status` above already waited for the new ReplicaSet, so
          # this only has to confirm the result. It checks "at least one
          # ready" rather than ready == desired: the HPA can add a replica at
          # any moment, and a pod that is still starting is not a failed
          # deploy.
          ready=$(kubectl -n "$NAMESPACE" get "deployment/$DEPLOYMENT" \
            -o jsonpath='{.status.readyReplicas}')
          if [ "${ready:-0}" -lt 1 ]; then
            echo "::error::Smoke test failed - no replica passed its readiness probe"
            kubectl -n "$NAMESPACE" describe "deployment/$DEPLOYMENT" || true
            kubectl -n "$NAMESPACE" logs -l app="$DEPLOYMENT" --tail=100 --since=5m || true
            exit 1
          fi
          echo "$ready replica(s) passed the readiness probe on the management port"

          # Readiness proves the app is up, not that anyone can reach it: that
          # is a different port and never touches the ingress. /v3/api-docs is
          # served without a token, so it works as a public liveness signal.
          public_status=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' \
            https://api.sakena.aptcodegen.online/v3/api-docs)
          if [ "$public_status" != "200" ]; then
            echo "::error::Public ingress is not serving the API (got $public_status)"
            kubectl -n "$NAMESPACE" logs -l app="$DEPLOYMENT" --tail=50 --since=5m || true
            exit 1
          fi
          echo "Public ingress is serving the API"
