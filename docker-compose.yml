services:
  db:
    image: postgres:14
    container_name: sakena-db
    environment:
      POSTGRES_DB: ${DB_NAME:-sakena}
      POSTGRES_USER: ${DB_USERNAME:-sakena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sakena}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sakena-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sakena} -d ${DB_NAME:-sakena}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # -cpuv1: older CPUs without x86-64-v2 (glibc). Console stays free on this 2025 release.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: sakena-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sakena}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sakena-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - sakena-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sakena-app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-sakena}
      DB_USERNAME: ${DB_USERNAME:-sakena}
      DB_PASSWORD: ${DB_PASSWORD:-sakena}
      SERVER_PORT: 8080
      JWT_SECRET: ipp3tok924jIS0d2q7PklWf6HwvPoUjIGsFU2a9kvMs=
      JWT_EXPIRATION_MS: 86400000
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      APP_RESET_TOKEN_EXPIRATION_MINUTES: ${APP_RESET_TOKEN_EXPIRATION_MINUTES:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-sakena}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-sakena-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-sakena-chat}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  sakena-db-data:
  sakena-minio-data:
