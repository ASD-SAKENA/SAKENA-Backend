services:
  sakena_db:
    image: postgres:14
    container_name: sakena_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sakena}
      POSTGRES_USER: ${DB_USERNAME:-sakena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - sakena-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sakena} -d ${DB_NAME:-sakena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - infra_network

  sakena_minio:
    # -cpuv1: older CPUs without x86-64-v2 (glibc). Console stays free on this 2025 release.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: sakena_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sakena}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - sakena-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - infra_network

  sakena_backend:
    image: ghcr.io/asd-sakena/sakena-backend:latest
    container_name: sakena_backend
    restart: unless-stopped
    depends_on:
      sakena_db:
        condition: service_healthy
      sakena_minio:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DB_URL: jdbc:postgresql://sakena_db:5432/${DB_NAME:-sakena}
      SERVER_PORT: 8080
      # In-cluster endpoint; browsers use MINIO_PUBLIC_ENDPOINT from .env
      MINIO_ENDPOINT: http://sakena_minio:9000
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - infra_network

volumes:
  sakena-db-data:
  sakena-minio-data:

networks:
  infra_network:
    external: true
